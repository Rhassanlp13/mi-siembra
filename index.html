<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 Mi Siembra — Pilón, Granma</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Configuración de Tailwind -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            brand: {
              50:'#ecfdf5', 100:'#d1fae5', 200:'#a7f3d0', 300:'#6ee7b7',
              400:'#34d399', 500:'#10b981', 600:'#059669', 700:'#047857',
              800:'#065f46', 900:'#064e3b', 950:'#022c22'
            },
            ink: {
              50:'#f8fafc', 100:'#f1f5f9', 200:'#e2e8f0', 300:'#cbd5e1',
              400:'#94a3b8', 500:'#64748b', 600:'#475569', 700:'#334155',
              800:'#1e293b', 850:'#172033', 900:'#0f172a', 950:'#080d17'
            }
          },
          boxShadow: {
            'soft':          '0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06)',
            'card':          '0 1px 2px rgba(0,0,0,.2), 0 8px 24px -8px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.05) inset',
            'card-hover':    '0 4px 6px rgba(0,0,0,.3), 0 20px 40px -12px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08) inset',
            'glow-emerald':  '0 0 24px -4px rgba(16,185,129,.5), 0 0 60px -8px rgba(16,185,129,.3)',
            'glow-amber':    '0 0 24px -4px rgba(245,158,11,.5)',
            'glow-indigo':   '0 0 24px -4px rgba(99,102,241,.5)',
            'inset-soft':    'inset 0 1px 2px rgba(0,0,0,.3)',
            'inner-ring':    'inset 0 0 0 1px rgba(255,255,255,.06)'
          },
          animation: {
            'fade-in':    'fadeIn .5s ease-out',
            'slide-up':   'slideUp .6s cubic-bezier(.16,1,.3,1) both',
            'pulse-soft': 'pulseSoft 3s ease-in-out infinite',
            'float':      'float 6s ease-in-out infinite',
            'shimmer':    'shimmer 3s linear infinite'
          },
          keyframes: {
            fadeIn:    { '0%':{opacity:'0'}, '100%':{opacity:'1'} },
            slideUp:   { '0%':{opacity:'0',transform:'translateY(16px)'}, '100%':{opacity:'1',transform:'translateY(0)'} },
            pulseSoft: { '0%,100%':{opacity:'1'}, '50%':{opacity:'.75'} },
            float:     { '0%,100%':{transform:'translateY(0)'}, '50%':{transform:'translateY(-6px)'} },
            shimmer:   { '0%':{backgroundPosition:'-200% 0'}, '100%':{backgroundPosition:'200% 0'} }
          }
        }
      }
    }
  </script>

  <!-- Estilos propios -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="content">

  <!-- ══════════════════════════════════════
       HEADER
       ══════════════════════════════════════ -->
  <header class="sticky top-0 z-30 glass border-b border-white/5">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3.5 flex items-center gap-3">

      <div class="relative">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-brand-300 via-brand-500 to-brand-700 flex items-center justify-center text-xl shadow-glow-emerald">
          🌱
        </div>
        <div class="absolute -inset-1 rounded-2xl bg-gradient-to-br from-brand-400 to-brand-700 blur-lg opacity-30 -z-10"></div>
      </div>

      <div class="flex-1 min-w-0">
        <h1 class="text-[15px] sm:text-base font-extrabold text-slate-100 tracking-tight leading-tight">
          Mi Siembra
        </h1>
        <p class="text-[11px] sm:text-xs text-slate-500 flex items-center gap-1">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Pilón, Granma · Cuba
        </p>
      </div>

      <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-brand-500/10 border border-brand-500/20">
        <span class="relative flex h-1.5 w-1.5">
          <span class="absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75 animate-ping"></span>
          <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-brand-400"></span>
        </span>
        <span class="text-xs font-bold text-brand-300">En vivo</span>
      </div>

      <button id="themeToggle" class="theme-toggle" title="Cambiar tema" aria-label="Cambiar tema">
        <svg id="iconMoon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="iconSun" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ══════════════════════════════════════
       BARRA LUNAR
       ══════════════════════════════════════ -->
  <div class="max-w-5xl mx-auto px-4 sm:px-6 mt-5">
    <div id="moonBar" class="moon-bar rounded-3xl p-5 sm:p-6 text-white animate-fade-in">
      <div class="stars-field" id="stars"></div>
      <div class="relative flex items-center gap-5">
        <div class="relative shrink-0">
          <div id="moonIcon" class="text-5xl sm:text-6xl drop-shadow-[0_6px_20px_rgba(255,255,255,.35)] animate-float">🌙</div>
          <div class="absolute inset-0 bg-indigo-400/30 blur-2xl -z-10 rounded-full"></div>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-[10px] uppercase tracking-[.2em] font-bold text-indigo-300/80">Cielo de hoy</p>
          <div id="moonName" class="text-lg sm:text-xl font-extrabold tracking-tight mt-0.5">Calculando…</div>
          <div id="moonRec" class="text-xs sm:text-sm text-slate-300/90 mt-1">—</div>
          <div class="hidden sm:flex items-center gap-4 mt-3 text-[11px] text-slate-400">
            <span class="inline-flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 shadow-glow-indigo"></span>
              <span id="moonIlum">—</span>
            </span>
            <span class="inline-flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-400 shadow-glow-amber"></span>
              <span id="moonAge">—</span>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       MAIN
       ══════════════════════════════════════ -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 space-y-6">

    <!-- FORMULARIO -->
    <section class="panel panel-accent p-5 sm:p-6 animate-fade-in">
      <div class="flex items-center gap-3 mb-5">
        <div class="w-9 h-9 rounded-xl bg-brand-500/15 border border-brand-500/25 flex items-center justify-center shadow-inner-ring">
          <svg class="w-4 h-4 text-brand-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
        <div>
          <h2 class="text-[15px] font-extrabold text-slate-100 tracking-tight">Registrar nueva siembra</h2>
          <p class="text-[11px] text-slate-500">Añade un cultivo y sigue su crecimiento</p>
        </div>
      </div>

      <form id="formSiembra" class="grid gap-4">
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="field" for="cultivo">Cultivo</label>
            <select id="cultivo" required class="input"></select>
          </div>
          <div>
            <label class="field" for="variedad">Variedad</label>
            <select id="variedad" required class="input"></select>
          </div>
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="field" for="fecha">Fecha de siembra</label>
            <input type="date" id="fecha" required class="input">
          </div>
          <div>
            <label class="field" for="notas">Notas (opcional)</label>
            <input type="text" id="notas" placeholder="Ej: en el huerto de atrás" class="input">
          </div>
        </div>

        <button type="submit" class="btn-primary group">
          <svg class="w-4 h-4 transition-transform group-hover:rotate-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Registrar siembra
        </button>
      </form>

      <div class="flex items-center justify-between mt-5 pt-4 border-t border-white/5">
        <p class="text-[11px] text-slate-500">💡 Prueba rápida con datos de ejemplo</p>
        <button type="button" id="btnDemo"
          class="text-[11px] font-bold text-brand-300 hover:text-brand-200 bg-brand-500/10 hover:bg-brand-500/20 px-3 py-1.5 rounded-lg transition border border-brand-500/20">
          Cargar yuca 6-sep-2026
        </button>
      </div>
    </section>

    <!-- LISTA -->
    <section>
      <div class="flex items-center justify-between mb-4 px-1">
        <h2 class="text-base font-extrabold text-slate-100 tracking-tight flex items-center gap-2.5">
          <span>🌾</span> Mis siembras
          <span id="contador" class="text-[10px] font-bold text-brand-300 bg-brand-500/10 border border-brand-500/20 px-2 py-0.5 rounded-full">0</span>
        </h2>
      </div>
      <div id="listaSiembras" class="grid gap-4 sm:grid-cols-1 lg:grid-cols-2"></div>
    </section>

  </main>

  <footer class="max-w-5xl mx-auto px-6 py-10 text-center text-[11px] text-slate-600">
    Hecho con 🌱 para los campos de Pilón · Fase lunar calculada astronómicamente
  </footer>

</div>

<!-- Script principal -->
<script src="app.js"></script>
</body>
</html>
